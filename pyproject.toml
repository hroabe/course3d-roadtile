[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "course3d-roadtile"
version = "0.3.0"
description = "OpenStreetMap から大会コース3D用の道路タイルを作る加工スクリプト"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "osmium>=4.0,<5",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
course3d-roadtile = "roadtile.cli:main"

[tool.setuptools]
packages = ["roadtile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
